AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  ReleEasy Cloud - Rol de despliegue en la cuenta del cliente (D-18).
  Crea el rol ReleEasyDeployRole, que confia en la cuenta de la plataforma ReleEasy
  y solo puede asumirse presentando el External ID del cliente. La plataforma asume
  este rol (sts:AssumeRole) para desplegar la infraestructura de las aplicaciones del
  cliente con Terraform. El cliente crea este rol una sola vez, mediante el enlace
  Quick-create que le ofrece el portal; no necesita instalar ni ejecutar nada.

# -----------------------------------------------------------------------------
# Parametros
#
# El portal rellena estos dos valores en el enlace Quick-create, de modo que el
# cliente solo tiene que revisar y pulsar "Crear stack" en su propia consola de AWS.
# -----------------------------------------------------------------------------
Parameters:
  PlatformAccountId:
    Type: String
    Description: >-
      ID (12 digitos) de la cuenta AWS de la plataforma ReleEasy. Es la unica cuenta
      autorizada a asumir este rol.
    AllowedPattern: "^[0-9]{12}$"
    ConstraintDescription: Debe ser un ID de cuenta AWS de 12 digitos.

  ExternalId:
    Type: String
    Description: >-
      Identificador secreto generado por ReleEasy para este cliente. La plataforma
      debe presentarlo al asumir el rol; sin el, el AssumeRole se rechaza. Evita el
      problema del "confused deputy".
    MinLength: 8
    MaxLength: 128
    NoEcho: true

  RoleName:
    Type: String
    Description: Nombre del rol. No es necesario cambiarlo.
    Default: ReleEasyDeployRole

# -----------------------------------------------------------------------------
# Recursos
# -----------------------------------------------------------------------------
Resources:
  ReleEasyDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: >-
        Rol que asume la plataforma ReleEasy para desplegar la infraestructura de las
        aplicaciones del cliente. Creado por CloudFormation (bootstrap BYOA).
      MaxSessionDuration: 3600
      # Politica de confianza: solo la cuenta de la plataforma, y solo si presenta
      # el External ID correcto.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${PlatformAccountId}:root"
            Action: "sts:AssumeRole"
            Condition:
              StringEquals:
                "sts:ExternalId": !Ref ExternalId
      # Permisos de despliegue, acotados a los servicios que usan las plantillas de
      # ReleEasy (angular-static, springboot-api y angular-springboot). Se separan en
      # politicas por area para que sean legibles y auditables.
      Policies:
        # --- Front estatico: S3 privado + CloudFront con OAC ---
        - PolicyName: ReleEasy-Frontend
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: S3Buckets
                Effect: Allow
                Action:
                  - "s3:CreateBucket"
                  - "s3:DeleteBucket"
                  - "s3:PutBucketPolicy"
                  - "s3:GetBucketPolicy"
                  - "s3:DeleteBucketPolicy"
                  - "s3:PutBucketPublicAccessBlock"
                  - "s3:GetBucketPublicAccessBlock"
                  - "s3:PutEncryptionConfiguration"
                  - "s3:GetEncryptionConfiguration"
                  - "s3:PutBucketVersioning"
                  - "s3:GetBucketVersioning"
                  - "s3:PutBucketTagging"
                  - "s3:GetBucketTagging"
                  - "s3:GetBucketLocation"
                  - "s3:ListBucket"
                  - "s3:PutObject"
                  - "s3:GetObject"
                  - "s3:DeleteObject"
                Resource:
                  - "arn:aws:s3:::releasy-*"
                  - "arn:aws:s3:::releasy-*/*"
              - Sid: CloudFront
                Effect: Allow
                Action:
                  - "cloudfront:CreateDistribution"
                  - "cloudfront:UpdateDistribution"
                  - "cloudfront:DeleteDistribution"
                  - "cloudfront:GetDistribution"
                  - "cloudfront:GetDistributionConfig"
                  - "cloudfront:TagResource"
                  - "cloudfront:CreateOriginAccessControl"
                  - "cloudfront:UpdateOriginAccessControl"
                  - "cloudfront:DeleteOriginAccessControl"
                  - "cloudfront:GetOriginAccessControl"
                  - "cloudfront:CreateInvalidation"
                Resource: "*"

        # --- Backend: VPC, EC2 Auto Scaling, ALB, ECR ---
        - PolicyName: ReleEasy-Backend
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Networking
                Effect: Allow
                Action:
                  - "ec2:*Vpc*"
                  - "ec2:*Subnet*"
                  - "ec2:*RouteTable*"
                  - "ec2:*InternetGateway*"
                  - "ec2:*NatGateway*"
                  - "ec2:*Address*"
                  - "ec2:*SecurityGroup*"
                  - "ec2:Describe*"
                  - "ec2:*Tags*"
                Resource: "*"
              - Sid: ComputeAutoscaling
                Effect: Allow
                Action:
                  - "ec2:RunInstances"
                  - "ec2:TerminateInstances"
                  - "ec2:*LaunchTemplate*"
                  - "autoscaling:*"
                  - "elasticloadbalancing:*"
                Resource: "*"
              - Sid: Ecr
                Effect: Allow
                Action:
                  - "ecr:*"
                Resource: "*"

        # --- Observabilidad: CloudWatch Logs, alarmas, metricas, SNS, RUM, X-Ray ---
        - PolicyName: ReleEasy-Observability
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Monitoring
                Effect: Allow
                Action:
                  - "logs:*"
                  - "cloudwatch:*"
                  - "sns:*"
                  - "rum:*"
                  - "xray:*"
                Resource: "*"

        # --- Opcionales: WAF, dominio propio (Route 53 + ACM), API Gateway ---
        - PolicyName: ReleEasy-Optional
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WafDomainApiGateway
                Effect: Allow
                Action:
                  - "wafv2:*"
                  - "route53:*"
                  - "acm:*"
                  - "apigateway:*"
                Resource: "*"

        # --- IAM: crear los roles de instancia y perfiles que necesitan las apps ---
        # Acotado por prefijo de nombre (releasy-*) para no poder crear roles arbitrarios.
        - PolicyName: ReleEasy-Iam
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AppRoles
                Effect: Allow
                Action:
                  - "iam:CreateRole"
                  - "iam:DeleteRole"
                  - "iam:GetRole"
                  - "iam:PassRole"
                  - "iam:AttachRolePolicy"
                  - "iam:DetachRolePolicy"
                  - "iam:PutRolePolicy"
                  - "iam:DeleteRolePolicy"
                  - "iam:GetRolePolicy"
                  - "iam:ListRolePolicies"
                  - "iam:ListAttachedRolePolicies"
                  - "iam:TagRole"
                  - "iam:CreateInstanceProfile"
                  - "iam:DeleteInstanceProfile"
                  - "iam:GetInstanceProfile"
                  - "iam:AddRoleToInstanceProfile"
                  - "iam:RemoveRoleFromInstanceProfile"
                Resource:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/releasy-*"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:instance-profile/releasy-*"

# -----------------------------------------------------------------------------
# Salida
#
# El cliente copia este ARN y lo pega en el portal de ReleEasy. La plataforma
# comprueba entonces que puede asumir el rol con el External ID (AwsConnectionService).
# -----------------------------------------------------------------------------
Outputs:
  RoleArn:
    Description: ARN del rol. Pegalo en el portal de ReleEasy para completar la conexion.
    Value: !GetAtt ReleEasyDeployRole.Arn
